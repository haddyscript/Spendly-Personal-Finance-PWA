<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="description" content="Spendly — a private, offline-first personal finance app. Track income, expenses, budgets, and goals. Your data never leaves your device." />
    <meta name="theme-color" content="#fafafb" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendly" />

    <title>Spendly — Know where your money goes</title>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('spendly-theme') || 'system'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark)
          if (isDark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#09090b')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
